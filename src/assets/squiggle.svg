<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 0 208 12" preserveAspectRatio="none">
  <!-- Hand-drawn gold underline for page titles and the selected nav tab. It stretches to fit
       (preserveAspectRatio="none"), while the line itself stays 4px thick (non-scaling-stroke).
       The viewBox has 4 units of room on each side so the rounded ends are never clipped. -->
  <path d="M2 8 C 40 10, 80 9.5, 118 7.5 S 175 2.5, 198 7"
        fill="none" stroke="#dfa53e" stroke-width="4" stroke-linecap="round"
        vector-effect="non-scaling-stroke" />
</svg>
